<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Management | Camera Stock Control</title>
  <style>
    :root { --bg:#0a0f1a; --panel:#0b1220; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; --accent:#2563eb; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .container { max-width: 980px; margin: 0 auto; padding: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 24px; }
    h1 { margin:0 0 8px; }
    a { color: var(--accent); text-decoration: none; }
    .muted { color: var(--muted); }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin: 10px 0; }
    input[type=text], input[type=password] { width:260px; padding:8px 10px; border-radius:6px; background:#0b1220; color:#e5e7eb; border:1px solid #334155; }
    select { padding:8px 10px; border-radius:6px; background:#0b1220; color:#e5e7eb; border:1px solid #334155; }
    button { background:#111827; color:#e5e7eb; border:1px solid #334155; padding:6px 10px; border-radius:8px; cursor:pointer; }
    button.primary { background:#1e293b; border-color:#475569; }
    button.danger { background:#7f1d1d; border-color:#b91c1c; }
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #1f2937; padding: 8px; text-align: left; }
    th { color:#94a3b8; font-weight:600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>User Management</h1>
      <p class="muted">Admins can add, edit and remove users who can access this app.</p>
      <p><a href="/">← Back to app</a></p>

      <div class="row">
        <input id="uName" type="text" placeholder="username" />
        <input id="uPass" type="password" placeholder="password" />
        <select id="uRole">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <button id="addBtn" class="primary">Add user</button>
      </div>

      <table>
        <thead>
          <tr><th>Username</th><th>Role</th><th style="width:240px">Actions</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div id="status" class="muted" style="margin-top:10px"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    function setStatus(msg){ statusEl.textContent = msg || ''; }

    function row(u) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${u.username}</td>
                      <td>${u.role||'user'}</td>
                      <td>
                        <button class="reset">Reset password</button>
                        <button class="makeAdmin">Make admin</button>
                        <button class="makeUser">Make user</button>
                        <button class="danger remove">Remove</button>
                      </td>`;
      return tr;
    }

    async function load() {
      setStatus('Loading...');
      const res = await fetch('/users');
      const data = await res.json();
      const list = data.users || [];
      const body = document.getElementById('tbody');
      body.innerHTML='';
      list.forEach(u => body.appendChild(row(u)));
      setStatus('');
    }

    async function save(users) {
      try {
        setStatus('Saving...');
        const res = await fetch('/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ users }) });
        const data = await res.json();
        if (!res.ok || data.error) {
          setStatus('Error: ' + (data.error || 'Failed to save users'));
          alert('Error: ' + (data.error || 'Failed to save users'));
          throw new Error(data.error || 'Failed to save users');
        }
        setStatus('Saved.');
      } catch (err) {
        console.error('Save error:', err);
        setStatus('Error: ' + err.message);
        alert('Error saving users: ' + err.message);
        throw err;
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      try {
        const name = (document.getElementById('uName').value||'').trim();
        const pass = (document.getElementById('uPass').value||'');
        const role = document.getElementById('uRole').value||'user';
        if (!name || !pass) { alert('Username and password required'); return; }
        const res = await fetch('/users'); const data = await res.json();
        const users = data.users || [];
        if (users.some(u => (u.username||'').toLowerCase() === name.toLowerCase())) { alert('User already exists'); return; }
        users.push({ username: name, password: pass, role });
        await save(users);
        document.getElementById('uName').value = '';
        document.getElementById('uPass').value = '';
        load();
      } catch (err) {
        console.error('Add user error:', err);
        setStatus('Error: ' + err.message);
      }
    });

    document.getElementById('tbody').addEventListener('click', async (e) => {
      try {
        const tr = e.target.closest('tr');
        if (!tr) return;
        const username = tr.children[0].innerText;
        const res = await fetch('/users'); const data = await res.json();
        let users = data.users || [];
        const idx = users.findIndex(u => (u.username||'').toLowerCase() === username.toLowerCase());
        if (idx < 0) return;

        if (e.target.classList.contains('remove')) {
          if (!confirm('Remove user '+username+'?')) return;
          users.splice(idx,1);
          await save(users); load(); return;
        }
        if (e.target.classList.contains('reset')) {
          const np = prompt('Enter new password for '+username+' (min 12 chars incl. upper, lower, number, special)');
          if (!np) return; users[idx].password = np; await save(users); alert('Password reset'); return;
        }
        if (e.target.classList.contains('makeAdmin')) { users[idx].role = 'admin'; await save(users); load(); return; }
        if (e.target.classList.contains('makeUser')) { users[idx].role = 'user'; await save(users); load(); return; }
      } catch (err) {
        console.error('User action error:', err);
        setStatus('Error: ' + err.message);
      }
    });

    load();
  </script>
</body>
</html>
