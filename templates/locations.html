<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locations | Facewatch SAFR Camera Stock Control</title>
  <style>
    :root { --bg: #0a0f1a; --panel: #0b1220; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2937; --accent: #2563eb; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .container { max-width: 1180px; margin: 0 auto; padding: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 24px; }
    h1 { margin:0 0 8px; }
    a { color: var(--accent); text-decoration: none; }
    .muted { color: var(--muted); }

    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    input[type=text] { width:280px; padding:8px 10px; border-radius:6px; background:#0b1220; color:#e5e7eb; border:1px solid #334155; }
    button { background:#111827; color:#e5e7eb; border:1px solid #334155; padding:6px 10px; border-radius:8px; cursor:pointer; }
    button.primary { background:#1e293b; border-color:#475569; }
    button.danger { background:#7f1d1d; border-color:#b91c1c; }
      <p id="returnWrap" style="display:none"><a id="returnLink" href="#">← Back to Stock</a></p>
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #1f2937; padding: 8px; text-align: left; }
    th { color:#94a3b8; font-weight:600; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top: 8px; }
    .chip { display:inline-flex; align-items:center; gap:6px; background:#0b1220; border:1px solid #334155; border-radius:999px; padding:4px 8px; }
    .chip button { background:none; border:none; color:#94a3b8; cursor:pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Locations</h1>
      <p class="muted">Create, rename and remove standard locations used in stock counts.</p>
      <p id="returnWrap" style="display:none"><a id="returnLink" href="#">← Back to Stock</a></p>

      <div class="row">
        <input id="newLoc" type="text" placeholder="Add a new location" />
        <button id="addBtn" class="primary">Add</button>
        <button id="saveBtn">Save Changes</button>
      </div>

      <div class="chips" id="locChips"></div>

      <table>
        <thead>
          <tr><th>Location</th><th style="width:220px">Actions</th></tr>
        </thead>
        <tbody id="locBody"></tbody>
      </table>

      <div id="status" class="muted" style="margin-top:10px"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const ret = params.get('return');

    function setStatus(msg) { statusEl.textContent = msg || ''; }

    // Setup return link if provided
    (function(){
      if (ret) {
        const wrap = document.getElementById('returnWrap');
        const link = document.getElementById('returnLink');
        wrap.style.display = '';
        try {
          const decoded = decodeURIComponent(ret);
          const u = new URL(decoded, window.location.origin);
          const usp = new URLSearchParams(u.search);
          usp.set('refresh','1');
          u.search = usp.toString();
          link.href = u.pathname + u.search;
        } catch {
          // Fallback to raw value if URL parsing fails
          link.href = ret;
        }
      }
    })();

    function rowTemplate(name) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="text" class="locName" value="${name}" /></td>
                      <td>
                        <button class="renameBtn">Rename</button>
                        <button class="danger removeBtn">Remove</button>
                      </td>`;
      return tr;
    }

    function render(list) {
      const body = document.getElementById('locBody');
      const chips = document.getElementById('locChips');
      body.innerHTML = '';
      chips.innerHTML = '';
      (list || []).forEach(n => {
        body.appendChild(rowTemplate(n));
        const c = document.createElement('span'); c.className='chip'; c.innerHTML = `${n}`; chips.appendChild(c);
      });
    }

    async function load() {
      setStatus('Loading...');
      const res = await fetch('/locations_data');
      const data = await res.json();
      render(data.locations || []);
      setStatus('');
    }

    async function save(list) {
    // If we arrived with a return link, append ?refresh=1 when going back
    if (ret) {
      const link = document.getElementById('returnLink');
      try {
        const u = new URL(link.href, window.location.origin);
        const usp = new URLSearchParams(u.search);
        usp.set('refresh','1');
        u.search = usp.toString();
        link.href = u.pathname + u.search;
      } catch {}
    }

      setStatus('Saving...');
      const res = await fetch('/locations_data', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ locations: list }) });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Failed to save');
      render(data.locations || []);
      setStatus('Saved.');
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const input = document.getElementById('newLoc');
      const v = (input.value || '').trim();
      if (!v) return;
      const current = Array.from(document.querySelectorAll('#locBody .locName')).map(i => i.value.trim()).filter(Boolean);
      if (!current.map(x=>x.toLowerCase()).includes(v.toLowerCase())) current.push(v);
      await save(current);
      input.value = '';
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const list = Array.from(document.querySelectorAll('#locBody .locName')).map(i => i.value.trim()).filter(Boolean);
      await save(list);
    });

    document.getElementById('locBody').addEventListener('click', async (e) => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      if (e.target.classList.contains('removeBtn')) {
        const name = tr.querySelector('.locName').value.trim();
        if (!confirm(`Remove location "${name}"?`)) return;
        const rest = Array.from(document.querySelectorAll('#locBody .locName')).map(i => i.value.trim()).filter(Boolean);
        const next = rest.filter(x => x.toLowerCase() !== name.toLowerCase());
        await save(next);
      }
      if (e.target.classList.contains('renameBtn')) {
        const cur = tr.querySelector('.locName').value.trim();
        const to = prompt('Rename location', cur) || '';
        const rest = Array.from(document.querySelectorAll('#locBody .locName')).map(i => i.value.trim()).filter(Boolean);
        const next = rest.map(x => x.toLowerCase() === cur.toLowerCase() ? to.trim() : x).filter(Boolean);
        await save(next);
      }
    });

    load();
  </script>
</body>
</html>
