<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account | Facewatch SAFR Camera Stock Control</title>
  <style>
    :root { --bg:#0a0f1a; --panel:#0b1220; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; --accent:#2563eb; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .container { max-width: 520px; margin: 14vh auto; padding: 0 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    h1 { margin:0 0 8px; }
    .muted { color: var(--muted); }
    label { display:block; font-size:12px; color:var(--muted); margin-top:12px; }
    input[type=password] { width:100%; padding:10px; border-radius:8px; background:#0b1220; color:#cbd5e1; border:1px solid #334155; }
    button { width:100%; margin-top:16px; background:var(--accent); border:none; color:#052e2b; padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
    .error { color:#ef4444; margin-top:10px; }
    .ok { color:#10b981; margin-top:10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Change password</h1>
      <p class="muted">Update your password for user <strong>{{ user }}</strong>.</p>
      {% if must_change %}<p class="error">For security, please set a new password before continuing.</p>{% endif %}
      <form method="post" action="/account">
        <label>Current password</label>
        <input type="password" name="current" autocomplete="current-password" />
        <label>New password</label>
        <input type="password" name="new" autocomplete="new-password" />
        <label>Confirm new password</label>
        <input type="password" name="confirm" autocomplete="new-password" />
        <button type="submit">Save</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
      </form>
      {% if not must_change %}<p class="muted" style="margin-top:14px; font-size:12px;"><a href="/">← Back to app</a></p>{% endif %}
    </div>
  </div>
</body>
</html>
