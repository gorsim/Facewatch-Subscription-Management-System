<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Camera Stock Control</title>
  <style>
    :root { --bg:#0a0f1a; --panel:#0b1220; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; --accent:#2563eb; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .container { max-width:420px; margin: 14vh auto; padding: 0 16px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; }
    h1 { margin:0 0 8px; font-size:22px; }
    p.muted { color:var(--muted); margin:0 0 16px; }
    label { display:block; font-size:12px; color:var(--muted); margin-top:12px; }
    input[type=text], input[type=password] { width:100%; padding:10px; border-radius:8px; background:#0b1220; color:#cbd5e1; border:1px solid #334155; }
    button { width:100%; margin-top:16px; background:var(--accent); border:none; color:#052e2b; padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
    .error { color:#ef4444; margin-top:10px; }
    .muted a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Sign in</h1>
      <p class="muted">Enter the credentials to access Camera Stock Control.</p>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}" />
        <label>Username</label>
        <input type="text" name="username" autofocus autocomplete="username" />
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" />
        <button type="submit">Sign in</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
      </form>
      <p class="muted" style="margin-top:14px; font-size:12px;">Tip: Set SECRET_KEY in your environment for sessions. The first admin user is seeded on first run if no users exist.</p>
    </div>
  </div>
</body>
</html>
